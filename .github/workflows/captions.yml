name: captions

# Downloads YouTube's captions for a video, playlist or channel tab and attaches them to the run as an artifact,
# filed as <year>/<mm-dd>/<video-id>.<lang>.srt. All logic is in production/get-captions.ps1; run it locally the same way.
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube video, playlist, or channel tab (https://www.youtube.com/@openziti/streams)
        required: true
      langs:
        description: Caption languages, yt-dlp --sub-langs syntax
        default: en

jobs:
  captions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download captions
        shell: pwsh
        env:
          URL: ${{ inputs.url }}
          LANGS: ${{ inputs.langs }}
          # optional: a Netscape cookies.txt, for when YouTube blocks the runner as a bot
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: ./production/get-captions.ps1 -Url $env:URL -Langs $env:LANGS -OutDir captions -Runtime docker
      - uses: actions/upload-artifact@v4
        with:
          name: captions-${{ github.run_id }}
          path: captions/
          if-no-files-found: warn
