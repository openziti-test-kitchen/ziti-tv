# HAProxy front door for the controller cluster.
# TCP passthrough (mode tcp) so Ziti's mTLS stays end to end, HAProxy never terminates TLS.
# Clients and ZAC point at one name (learning.openziti.local) and HAProxy load-balances across
# the three controller client APIs. The controllers must carry learning.openziti.local as a SAN
# (see scripts/front-door-certs.sh) or clients will reject the cert.

global
  log stdout format raw local0
  maxconn 4096

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client  1h
  timeout server  1h

frontend ziti_client_api
  bind *:1280
  default_backend ziti_controllers

backend ziti_controllers
  balance roundrobin
  option tcp-check
  server ctrl1 ziti-controller1:1280 check
  server ctrl2 ziti-controller2:1282 check
  server ctrl3 ziti-controller3:1283 check

# Stats UI (optional) on :8404
frontend stats
  mode http
  bind *:8404
  stats enable
  stats uri /
  stats refresh 5s
