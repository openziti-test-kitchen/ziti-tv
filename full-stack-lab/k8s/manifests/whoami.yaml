# A deliberately "dark" demo app: traefik/whoami exposed ONLY as a ClusterIP Service.
# There is no NodePort, no LoadBalancer, and no Ingress. From outside the cluster the only
# way to reach it is over the OpenZiti overlay (see ziti-host-values.yaml).
#
# whoami listens on :80 and echoes request/headers, which makes it easy to prove a dial worked.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: default
  labels:
    app: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:latest
          args: ["--port=80"]
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
# ClusterIP only. Reachable as whoami.default.svc.cluster.local:80 from inside the cluster.
# ziti-host runs as a pod inside this same cluster, so it can dial this ClusterIP and bind it
# onto the overlay as the hosted side of a Ziti service.
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: default
  labels:
    app: whoami
spec:
  type: ClusterIP
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: 80
