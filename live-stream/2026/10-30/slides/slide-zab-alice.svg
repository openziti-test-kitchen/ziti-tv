<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1530"/>
      <stop offset="55%" stop-color="#060E22"/>
      <stop offset="100%" stop-color="#030714"/>
    </linearGradient>
    <linearGradient id="accent" gradientTransform="rotate(27 .5 .5)">
      <stop offset="0%" stop-color="#0068F9"/>
      <stop offset="100%" stop-color="#FC0147"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111F3D" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#0A142B" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="shellFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1A36" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#071126" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0068F9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0068F9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FC0147" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FC0147" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1A3160" stroke-width="1" stroke-opacity="0.32"/>
    </pattern>
    <filter id="lift" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#01030A" flood-opacity="0.7"/>
    </filter>
    <marker id="arrowGrey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#6F86B0"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#0068F9"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <ellipse cx="1240" cy="610" rx="640" ry="460" fill="url(#glow)"/>
  <ellipse cx="220" cy="1000" rx="520" ry="360" fill="url(#glowRed)"/>

  <!-- title -->
  <text x="100" y="118" fill="#7F96C4" font-size="28" font-weight="600" letter-spacing="7">OPENZITI · ACCESS BRIDGE (ZAB) · ALICE</text>
  <text x="96" y="220" fill="#F2F6FF" font-size="76" font-weight="800" letter-spacing="-2">Your identity, <tspan fill="url(#accent)">past the tunnel</tspan></text>
  <rect x="100" y="252" width="120" height="8" rx="4" fill="url(#accent)"/>

  <!-- people -->
  <g>
    <g filter="url(#lift)"><rect x="96" y="340" width="220" height="150" rx="18" fill="url(#cardFill)" stroke="#0068F9" stroke-width="3.5"/></g>
    <text x="122" y="394" fill="#F2F6FF" font-size="34" font-weight="700">alice</text>
    <g font-size="20" font-weight="600">
      <rect x="122" y="420" width="76" height="40" rx="20" fill="#0A2A5C" stroke="#1D4FA0"/>
      <text x="160" y="447" fill="#A9CBFF" text-anchor="middle">#eng</text>
      <rect x="208" y="420" width="76" height="40" rx="20" fill="#0A2A5C" stroke="#1D4FA0"/>
      <text x="246" y="447" fill="#A9CBFF" text-anchor="middle">#fin</text>
    </g>
  </g>
  <g opacity="0.22">
    <g filter="url(#lift)"><rect x="96" y="510" width="220" height="150" rx="18" fill="url(#cardFill)" stroke="#2A4A78" stroke-width="2"/></g>
    <text x="122" y="564" fill="#F2F6FF" font-size="34" font-weight="700">bob</text>
    <g font-size="20" font-weight="600">
      <rect x="122" y="590" width="76" height="40" rx="20" fill="#0A2A5C" stroke="#1D4FA0"/>
      <text x="160" y="617" fill="#A9CBFF" text-anchor="middle">#eng</text>
    </g>
  </g>
  <g opacity="0.22">
    <g filter="url(#lift)"><rect x="96" y="680" width="220" height="150" rx="18" fill="url(#cardFill)" stroke="#2A4A78" stroke-width="2"/></g>
    <text x="122" y="734" fill="#F2F6FF" font-size="34" font-weight="700">carol</text>
    <text x="122" y="790" fill="#FC0147" font-size="22" font-weight="600">no roles</text>
  </g>

  <!-- cloudflare -->
  <rect x="406" y="320" width="360" height="580" rx="30" fill="url(#shellFill)" stroke="#22406E" stroke-width="2"/>
  <text x="430" y="370" fill="#7F96C4" font-size="25" font-weight="700" letter-spacing="5">CLOUDFLARE</text>
  <g filter="url(#lift)"><rect x="430" y="396" width="312" height="210" rx="20" fill="url(#cardFill)" stroke="#2A4A78" stroke-width="2"/></g>
  <text x="458" y="452" fill="#F2F6FF" font-size="34" font-weight="700">Access</text>
  <text x="458" y="500" fill="#A3B4D6" font-size="24">Keycloak sign-in</text>
  <text x="458" y="540" fill="#A3B4D6" font-size="24">issues a signed JWT</text>
  <g filter="url(#lift)"><rect x="430" y="650" width="312" height="220" rx="20" fill="url(#cardFill)" stroke="#2A4A78" stroke-width="2"/></g>
  <text x="458" y="706" fill="#F2F6FF" font-size="34" font-weight="700">Tunnel</text>
  <text x="458" y="754" fill="#A3B4D6" font-size="24">the JWT rides along</text>

  <!-- zab -->
  <text x="846" y="340" fill="#7F96C4" font-size="25" font-weight="700" letter-spacing="5">ZAB</text>
  <g filter="url(#lift)"><rect x="846" y="360" width="420" height="500" rx="24" fill="url(#cardFill)" stroke="#0068F9" stroke-width="2.5"/></g>
  <path d="M846 384a24 24 0 0 1 24-24h372a24 24 0 0 1 24 24v48H846z" fill="#12305E"/>
  <circle cx="884" cy="408" r="9" fill="#FC0147"/>
  <circle cx="914" cy="408" r="9" fill="#7E35A0"/>
  <circle cx="944" cy="408" r="9" fill="#0068F9"/>
  <text x="984" y="417" fill="#7F96C4" font-size="23" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace">zab run</text>
  <g font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="30">
    <text x="884" y="530" fill="#F2F6FF"><tspan fill="#56709C">1 </tspan>verify the JWT</text>
    <text x="884" y="630" fill="#F2F6FF"><tspan fill="#56709C">2 </tspan>sign in as <tspan fill="#5C9DFF">alice</tspan></text>
    <text x="884" y="730" fill="#F2F6FF"><tspan fill="#56709C">3 </tspan>dial as <tspan fill="#5C9DFF">alice</tspan></text>
  </g>
  <text x="884" y="812" fill="#56709C" font-size="22">no inbound port</text>


  <!-- openziti -->
  <rect x="1346" y="320" width="478" height="580" rx="30" fill="url(#shellFill)" stroke="#22406E" stroke-width="2"/>
  <text x="1372" y="370" fill="#7F96C4" font-size="25" font-weight="700" letter-spacing="5">OPENZITI</text>
  <g filter="url(#lift)"><rect x="1372" y="396" width="426" height="174" rx="20" fill="url(#cardFill)" stroke="#2A4A78" stroke-width="2"/></g>
  <text x="1400" y="446" fill="#F2F6FF" font-size="30" font-weight="700">Service policy</text>
  <g font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="24">
    <text x="1400" y="496" fill="#6F86B0">Dial <tspan fill="#F2F6FF">#eng</tspan> → <tspan fill="#5C9DFF">wiki</tspan></text>
    <text x="1400" y="538" fill="#6F86B0">Dial <tspan fill="#F2F6FF">#fin</tspan> → <tspan fill="#5C9DFF">ledger</tspan></text>
  </g>
  <g filter="url(#lift)"><rect x="1372" y="590" width="426" height="106" rx="20" fill="url(#cardFill)" stroke="#2A4A78" stroke-width="2"/></g>
  <text x="1400" y="653" fill="#F2F6FF" font-size="30" font-weight="700">Edge router</text>
  <g>
    <g filter="url(#lift)"><rect x="1372" y="716" width="203" height="154" rx="20" fill="url(#cardFill)" stroke="#0068F9" stroke-width="3"/></g>
    <text x="1398" y="776" fill="#F2F6FF" font-size="32" font-weight="700">wiki</text>
    <text x="1398" y="822" fill="#A9CBFF" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace">#eng</text>
  </g>
  <g>
    <g filter="url(#lift)"><rect x="1595" y="716" width="203" height="154" rx="20" fill="url(#cardFill)" stroke="#0068F9" stroke-width="3"/></g>
    <text x="1621" y="776" fill="#F2F6FF" font-size="32" font-weight="700">ledger</text>
    <text x="1621" y="822" fill="#A9CBFF" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace">#fin</text>
  </g>

  <!-- flows -->
  <path d="M316 430 C364 430 384 452 424 452" fill="none" stroke="#6F86B0" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrowGrey)"/>
  <text x="322" y="412" fill="#8FA4CC" font-size="22" font-weight="600">sign in</text>
  <path d="M586 606 L586 642" fill="none" stroke="#0068F9" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="602" y="632" fill="#5C9DFF" font-size="21" font-weight="600">JWT</text>
  <path d="M742 760 C792 760 800 700 840 700" fill="none" stroke="#0068F9" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <g>
    <path d="M1266 470 C1300 470 1330 470 1366 470" fill="none" stroke="#6F86B0" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrowGrey)"/>
    <text x="1306" y="448" fill="#8FA4CC" font-size="20" font-weight="600" text-anchor="middle">JWT</text>
    <path d="M1266 640 C1300 640 1330 640 1366 640" fill="none" stroke="#0068F9" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="1306" y="618" fill="#5C9DFF" font-size="20" font-weight="600" text-anchor="middle">as alice</text>
  </g>

  <!-- caption -->
  <text x="96" y="1006" fill="#A3B4D6" font-size="34" font-weight="500">alice reaches <tspan fill="#5C9DFF">the wiki and the ledger</tspan>.</text>
  <text x="1800" y="1046" text-anchor="end" fill="#0068F9" font-size="28" font-weight="700" letter-spacing="4">OPENZITI</text>
</svg>
